name: Build Flutter APKs (Demo)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Only one run at a time per branch; older queued runs are cancelled.
# This prevents race conditions between runs on the same runner queue.
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: Build APKs for Customer, Driver, and Merchant
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      # Build the 3 apps in parallel, each on its own runner,
      # so one slow app cannot block the others.
      matrix:
        app: [app-customer, app-driver, app-merchant]
      max-parallel: 3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true

      - name: Disable Gradle daemon and VFS file watching in CI
        run: |
          for dir in app-customer app-driver app-merchant; do
            echo "org.gradle.daemon=false" >> $dir/android/gradle.properties
            echo "org.gradle.caching=false" >> $dir/android/gradle.properties
            echo "org.gradle.vfs.watch=false" >> $dir/android/gradle.properties
          done

      - name: Stop any lingering Gradle daemon
        run: |
          ./gradlew --stop || true
        working-directory: ${{ matrix.app }}/android
        continue-on-error: true

      - name: Flutter Clean + Pub Get
        run: |
          flutter clean
          flutter pub get
        working-directory: ${{ matrix.app }}

      - name: Build APK (release)
        timeout-minutes: 45
        run: flutter build apk --release
        working-directory: ${{ matrix.app }}

      - name: Rename APK per app
        if: success()
        run: cp ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk ${{ matrix.app }}/build/app/outputs/flutter-apk/${{ matrix.app }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/${{ matrix.app }}.apk
