name: Build Flutter APKs (Demo)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Prevent concurrent runs from racing on the same working directory
# (old run cancelled automatically when a new push arrives)
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        app: [app-customer, app-driver, app-merchant]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true

      - name: Stop any leftover Gradle daemons
        run: |
          (./gradlew --stop || true)
          pkill -f "GradleDaemon" || true

      - name: Disable Gradle daemon and VFS file watching in CI
        run: |
          echo "org.gradle.daemon=false" >> ${{ matrix.app }}/android/gradle.properties
          echo "org.gradle.caching=false" >> ${{ matrix.app }}/android/gradle.properties
          echo "org.gradle.vfs.watch=false" >> ${{ matrix.app }}/android/gradle.properties

      - name: Flutter Clean + Pub Get
        run: |
          flutter clean
          flutter pub get
        working-directory: ${{ matrix.app }}

      - name: Build APK (release)
        run: flutter build apk --release
        working-directory: ${{ matrix.app }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
