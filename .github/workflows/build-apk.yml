name: Build Flutter APKs (Demo)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Only one run at a time per branch; older queued runs are cancelled.
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 35

    strategy:
      # Build the 3 apps in parallel, each on its own runner,
      # so one slow app cannot block the others.
      matrix:
        app: [app-customer, app-driver, app-merchant]
      max-parallel: 3

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true

      - name: Memory-safe Gradle settings (CI)
        timeout-minutes: 2
        run: |
          printf '\norg.gradle.daemon=false\norg.gradle.caching=false\norg.gradle.vfs.watch=false\norg.gradle.workers.max=1\norg.gradle.jvmargs=-Xmx1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8\n' >> android/gradle.properties
          printf 'flutter.sdk=%s\nflutter.buildMode=release\nflutter.versionName=1.0.0\nflutter.versionCode=1\n' "$FLUTTER_ROOT" > android/local.properties\n          echo "sdk.dir=${ANDROID_HOME}" >> android/local.properties

      - name: Stop any lingering Gradle daemon
        timeout-minutes: 2
        run: |
          ./gradlew --stop || true
        continue-on-error: true

      - name: Flutter Clean + Pub Get
        timeout-minutes: 8
        run: |
          flutter clean
          flutter pub get

      - name: Build APK (release)
        timeout-minutes: 25
        run: flutter build apk --release --no-tree-shake-icons --verbose | tee /tmp/flutter-build.log | tail -40

      - name: Rename APK per app
        timeout-minutes: 2
        if: success()
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ matrix.app }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/${{ matrix.app }}.apk
          retention-days: 7
