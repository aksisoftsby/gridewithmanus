    <rect x="-78" y="-20" width="156" height="140" rx="10" fill="#ecfdf5"/>
    <path d="M-42 120V38h84v82" fill="#0f766e"/>
    <circle cx="0" cy="-54" r="20" fill="#ffffff" opacity=".9"/>
